# ruff configuration for ZYN Empire
# https://docs.astral.sh/ruff/configuration/

# Match the project line length used in CONTRIBUTING.md.
line-length = 100

# Target Python 3.11 (matches the CI runner and VM).
target-version = "py311"

# Files/dirs ruff should not look at.
extend-exclude = [
    # bootstrap.py is a generated self-extractor; it intentionally has many
    # base64 string literals and one-line imports. Don't lint it.
    "zyn-empire-agents/bootstrap.py",
    # Generated audit snapshots.
    "zyn-ops/audits",
    # Local virtualenv.
    ".venv",
]

[lint]
# Default Ruff rule set is reasonable; we only relax a few that are too
# noisy for a logging-heavy operations codebase.
ignore = [
    "E501",  # line too long — long log strings are common
    "E402",  # module-level import after sys.path mangling — sometimes intentional
]

[lint.per-file-ignores]
# loguru add() calls in mission_control / health_audit / drift_detector use
# enqueue=True keyword args that ruff sometimes flags as "unused"; allow it.
"zyn-ops/*.py" = ["F401"]
