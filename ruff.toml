# ruff configuration for ZYN Empire
# https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py311"

# Files/dirs ruff should not look at.
extend-exclude = [
    # Generated audit snapshots.
    "zyn-ops/audits",
    # Local virtualenv.
    ".venv",
]

[lint]
# Default Ruff rule set is reasonable; we relax style nits that are noisy
# in a logging-heavy operations codebase.
ignore = [
    "E501",  # line too long — long log strings are common
    "E402",  # module-level import after sys.path mangling — sometimes intentional
    "E701",  # multiple statements on one line (colon) — used for compact guards
    "E702",  # multiple statements on one line (semicolon)
    "E401",  # multiple imports on one line
    "F401",  # imported but unused — common in __init__.py-style modules
    "F541",  # f-string without placeholders — fine in templated strings
]

[lint.per-file-ignores]
# The legacy agent stack was generated from a compact bootstrap.py; tolerate
# its style choices. New code in zyn-ops/ is held to the standard ruleset.
"zyn-empire-agents/*.py" = ["E", "W", "F"]
"zyn-empire-agents/bootstrap.py" = ["E", "W", "F"]
