name: Deploy Verifier
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# NOTE: This workflow used to SSH into the production VM and run pm2 reload.
# That model required VM_HOST / VM_USER / SSH_PRIVATE_KEY / SSH_PORT secrets,
# which is a large attack surface. We replaced it with a PULL model:
#   - The VM runs zyn-ops/mission_control.py as a pm2 daemon.
#   - mission_control.py polls origin/main every 30s, fast-forwards if clean,
#     and triggers pm2 reload on the agent ecosystem only when it sees changes
#     under zyn-empire-agents/.
#   - GitHub never holds an SSH key for the VM. No outbound deploy traffic.
# This workflow now just verifies the push is healthy.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm zyn-empire-agents/ is intact
        run: |
          test -f zyn-empire-agents/orchestrator.py
          test -f zyn-empire-agents/agents_config.json
          test -f zyn-empire-agents/ecosystem.config.js
          python3 -c "import json; json.load(open('zyn-empire-agents/agents_config.json'))"
      - name: Confirm zyn-ops/ is intact
        run: |
          test -f zyn-ops/mission_control.py
          test -f zyn-ops/health_audit.py
          test -f zyn-ops/drift_detector.py
          test -f zyn-ops/ecosystem.ops.config.js
      - name: Confirm dashboard.html present
        run: test -f dashboard.html
      - name: Summary
        run: |
          echo "::notice::main is healthy. mission_control.py on the VM will pull this commit on its next 30s tick."
