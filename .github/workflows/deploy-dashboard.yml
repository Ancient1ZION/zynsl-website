name: Deploy Dashboard



on:

  workflow_dispatch:
  


jobs:

  deploy:
  
    runs-on: ubuntu-latest
    
    permissions:
    
      contents: write
      
    steps:
    
      - uses: actions/checkout@v4
      

      
      - name: Fetch dashboard HTML
      
        run: |
        
                    curl -L https://dpaste.com/BCCPNH648.txt -o dashboard.html
          

      
      - name: Commit and push
      
        run: |
        
          git config user.name 'github-actions[bot]'
          
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add dashboard.html
          
          git commit -m 'ZYN Empire Dashboard all changes' || echo 'No changes'
          
          git push
