name: Deploy Dashboardon:  workflow_dispatch:jobs:  deploy:    runs-on: ubuntu-latest    permissions:      contents: write    steps:      - uses: actions/checkout@v4            - name: Fetch dashboard HTML        run: |          curl -L https://dpaste.com/FHB9W4KJG.txt -o dashboard.html          echo "File size: $(wc -c < dashboard.html) bytes"            - name: Commit and push        run: |          git config user.name 'github-actions[bot]'          git config user.email 'github-actions[bot]@users.noreply.github.com'          git add dashboard.html          git commit -m 'Deploy ZYN Empire Dashboard' || echo 'No changes'          git push
